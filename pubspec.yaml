name: wroote
description: "Wroote — um espaço tranquilo para planejar e escrever livros."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  provider: ^6.1.2

  # Persistência local (SQLite em desktop)
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Editor de texto rico
  flutter_quill: ^11.5.1

  # Efeitos sonoros da interface
  audioplayers: ^6.8.1

  # Preferências (tema, som ligado/desligado)
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/

  fonts:
    # Fonte da interface. Source Sans 3 tem altura-x generosa e desenho
    # neutro, o que segura bem os tamanhos pequenos de uma UI de desktop.
    - family: Source Sans 3
      fonts:
        - asset: fonts/source_sans/SourceSans3-Light.otf
          weight: 300
        - asset: fonts/source_sans/SourceSans3-LightIt.otf
          weight: 300
          style: italic
        - asset: fonts/source_sans/SourceSans3-Regular.otf
          weight: 400
        - asset: fonts/source_sans/SourceSans3-It.otf
          weight: 400
          style: italic
        - asset: fonts/source_sans/SourceSans3-Medium.otf
          weight: 500
        - asset: fonts/source_sans/SourceSans3-MediumIt.otf
          weight: 500
          style: italic
        - asset: fonts/source_sans/SourceSans3-Semibold.otf
          weight: 600
        - asset: fonts/source_sans/SourceSans3-SemiboldIt.otf
          weight: 600
          style: italic
        - asset: fonts/source_sans/SourceSans3-Bold.otf
          weight: 700
        - asset: fonts/source_sans/SourceSans3-BoldIt.otf
          weight: 700
          style: italic

    - family: Anthropic Serif
      fonts:
        - asset: fonts/serif/AnthropicSerif-Text-Regular-Static.otf
          weight: 400
        - asset: fonts/serif/AnthropicSerif-Text-RegularItalic-Static.otf
          weight: 400
          style: italic
        - asset: fonts/serif/AnthropicSerif-Text-Medium-Static.otf
          weight: 500
        - asset: fonts/serif/AnthropicSerif-Text-MediumItalic-Static.otf
          weight: 500
          style: italic
        - asset: fonts/serif/AnthropicSerif-Text-Semibold-Static.otf
          weight: 600
        - asset: fonts/serif/AnthropicSerif-Text-Bold-Static.otf
          weight: 700
        - asset: fonts/serif/AnthropicSerif-Text-BoldItalic-Static.otf
          weight: 700
          style: italic
