name: Build desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_cmd: flutter build windows --release
            artifact_name: wroote-windows
            artifact_path: |
              build/windows/x64/runner/Release/**
              build/windows/runner/Release/**
          - os: macos-latest
            platform: macos
            build_cmd: flutter build macos --release
            artifact_name: wroote-macos
            artifact_path: |
              build/macos/Build/Products/Release/**
          - os: ubuntu-latest
            platform: linux
            build_cmd: flutter build linux --release
            artifact_name: wroote-linux
            artifact_path: |
              build/linux/x64/release/bundle/**
              build/linux/release/bundle/**

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Enable ${{ matrix.platform }} desktop support
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - name: Generate native desktop runner (if missing)
        run: flutter create --platforms=${{ matrix.platform }} .

      - name: Install dependencies
        run: flutter pub get

      - name: Build ${{ matrix.platform }} release
        run: ${{ matrix.build_cmd }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: warn
